# Five names for the same container, so each command says what it works on:
#
#   docker compose run --rm soil [image | prices]          soil analysis and live prices
#   docker compose run --rm stock history                  stock price history
#   docker compose run --rm stockFutures backtest [image]  soil-matched stocks + palm oil signal
#   docker compose run --rm futures backtest               palm oil backtest only (data/main.py)
#   docker compose run --rm stocks backtest                stocks-only chart
#
# They all share one image (built once) and the same project folder.
# APP_SERVICE tells run.sh which name was used, since "backtest" means something different for each.
x-app: &app
  build: .
  image: oilpalm-trader
  working_dir: /app
  volumes:
    - .:/app

services:
  soil:
    <<: *app
    environment:
      APP_SERVICE: soil

  stock:
    <<: *app
    command: ["history"]
    environment:
      APP_SERVICE: stock

  stockFutures:
    <<: *app
    command: ["backtest"]
    environment:
      APP_SERVICE: stockFutures

  futures:
    <<: *app
    command: ["backtest"]
    environment:
      APP_SERVICE: futures

  stocks:
    <<: *app
    command: ["backtest"]
    environment:
      APP_SERVICE: stocks
